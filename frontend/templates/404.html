{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}

<div class="error-page">

    <div>

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>The page you requested does not exist.</p>

        <a href="{{ url_for('index') }}"
           class="btn btn-primary">
            Go Home
        </a>

    </div>

</div>

{% endblock %}
