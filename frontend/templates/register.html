{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">👤</div>

            <h1>Create Account</h1>

            <p>Join AI ServiceHub today.</p>

        </div>


        <form method="POST">

            <label>Full Name</label>

            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>


            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter email"
                   required>


            <label>Phone</label>

            <input type="text"
                   name="phone"
                   placeholder="Enter phone number">


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>


            <label>Account Type</label>

            <select name="role">

                <option value="customer">
                    Customer
                </option>

                <option value="worker">
                    Worker
                </option>

            </select>


            <button type="submit" class="btn btn-primary full">
                Create Account
            </button>

        </form>


        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
