{% extends "base.html" %}

{% block title %}Add Service{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Add Your Service</h1>

        <p>
            Add a service that customers can book.
        </p>


        <form method="POST">

            <label>Service Name</label>

            <input type="text"
                   name="name"
                   placeholder="Example: Home Electric Repair"
                   required>


            <label>Description</label>

            <textarea name="description"
                      placeholder="Describe your service..."
                      required></textarea>


            <label>Category</label>

            <input type="text"
                   name="category"
                   placeholder="Electric, Driving, Cleaning..."
                   required>


            <label>Price</label>

            <input type="number"
                   name="price"
                   min="1"
                   step="0.01"
                   placeholder="Enter price"
                   required>


            <button type="submit"
                    class="btn btn-primary full">
                Add Service
            </button>

        </form>

    </div>

</div>

{% endblock %}
